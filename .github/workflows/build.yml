name: Build

# Assembla tots els programes (NASM). En un push d'una etiqueta (p. ex.
# loadhi-0.18 o mem-0.12) en fa una Release amb el .COM, el .TXT i el
# codi font del programa.

on:
  push:
    branches: [ main ]
    tags: [ '*-*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install NASM
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: Assemble
        run: |
          mkdir -p out
          for asm in */*.ASM; do
            dir=$(dirname "$asm"); name=$(basename "$asm" .ASM)
            nasm -f bin "$asm" -o "out/$name.COM"
            if grep -aq "%ifdef TRACE" "$asm"; then
              nasm -f bin -DTRACE "$asm" -o "out/${name:0:6}T.COM"
            fi
            cp "$dir"/*.TXT "$dir"/*.CFG out/ 2>/dev/null || true
          done
          ls -l out
      - uses: actions/upload-artifact@v5
        with:
          name: pc1512-tools
          path: out/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF_NAME}
          prog=$(echo "${tag%%-*}" | tr a-z A-Z)
          ver=${tag#*-}
          [ -d "$prog" ] || { echo "no hi ha la carpeta $prog"; exit 1; }
          files=$(ls out/$prog*.COM out/$prog.TXT out/$prog.CFG 2>/dev/null; ls $prog/*.ASM)
          gh release create "$tag" --title "$prog $ver" \
            --notes "$prog $ver per a MS-DOS 3.x (Amstrad PC1512). Vegeu $prog.TXT." $files
